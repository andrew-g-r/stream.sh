# Requires nginx built with or loading nginx-rtmp-module.
# Load the module using your distribution's module config before this file.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
rtmp {
    server {
        listen 127.0.0.1:1935;
        chunk_size 4096;
        application live_stream {
            live on;
            record off;
            allow publish 127.0.0.1;
            deny publish all;
            allow play 127.0.0.1;
            deny play all;
            hls on;
            hls_path hls;
            hls_fragment 2s;
            hls_playlist_length 12s;
            hls_cleanup on;
        }
    }
}
http {
    server {
        listen 127.0.0.1:8080;
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root .;
            add_header Cache-Control no-cache;
        }
    }
}
